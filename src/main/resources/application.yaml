spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: eurokart

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/eurokartdb}
    username: ${SPRING_DATASOURCE_USERNAME:eurokart_user}
    password: ${SPRING_DATASOURCE_PASSWORD:eurokart_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      pool-name: EuroKartHikariPool
  cache:
    type: redis

logging:
  level:
    org:
      hibernate:
       sql: debug
       orm.jdbc.bind: trace
jwt:
  secret: ${JWT_SECRET:your-local-dev-secret}
  expiration: ${JWT_EXPIRATION:86400000}
